services:
  postgres:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_connections=30
      - -c
      - random_page_cost=1.1
      - -c
      - synchronous_commit=off
      - -c
      - autovacuum_vacuum_cost_delay=10ms
      - -c
      - autovacuum_vacuum_cost_limit=600
      - -c
      - autovacuum_max_workers=2
      - -c
      - autovacuum_naptime=30s
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - staging-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
  backend:
    image: ghcr.io/accsaber/accsaber-reloaded-backend:${IMAGE_TAG:-staging}
    pull_policy: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_PROFILES_ACTIVE: staging
      ACCSABER_DOMAINS: ${ACCSABER_DOMAINS:-accsaber.com}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_API_KEY: ${SERVICE_API_KEY}
      COMPLEXITY_AP_TARGET: ${COMPLEXITY_AP_TARGET}
      COMPLEXITY_ACCURACY_SHIFT: ${COMPLEXITY_ACCURACY_SHIFT}
      COMPLEXITY_TRANSFORM_OFFSET: ${COMPLEXITY_TRANSFORM_OFFSET}
      COMPLEXITY_TRANSFORM_SCALE: ${COMPLEXITY_TRANSFORM_SCALE}
      COMPLEXITY_TRANSFORM_BASE: ${COMPLEXITY_TRANSFORM_BASE}
      CRITERIA_CHECKER_URL: http://criteria-checker:8000
      COMPLEXITY_MODEL_URL: http://complexity-model:8000
      DISCORD_OAUTH_CLIENT_ID: ${DISCORD_OAUTH_CLIENT_ID}
      DISCORD_OAUTH_CLIENT_SECRET: ${DISCORD_OAUTH_CLIENT_SECRET}
      DISCORD_OAUTH_REDIRECT_URI: ${DISCORD_OAUTH_REDIRECT_URI}
      BEATLEADER_OAUTH_CLIENT_ID: ${BEATLEADER_OAUTH_CLIENT_ID}
      BEATLEADER_OAUTH_CLIENT_SECRET: ${BEATLEADER_OAUTH_CLIENT_SECRET}
      BEATLEADER_OAUTH_REDIRECT_URI: ${BEATLEADER_OAUTH_REDIRECT_URI}
      STEAM_OPENID_REALM: ${STEAM_OPENID_REALM}
      STEAM_OPENID_RETURN_TO: ${STEAM_OPENID_RETURN_TO}
      OAUTH_ALLOWED_RETURN_ORIGINS: ${OAUTH_ALLOWED_RETURN_ORIGINS}
      CDN_STORAGE_PATH: /var/cdn
      CDN_BASE_URL: ${CDN_BASE_URL:-https://staging-cdn.accsaber.com}
      CDN_BACKFILL_DELAY_MS: ${CDN_BACKFILL_DELAY_MS:-500}
      ITEM_FILES_STORAGE_PATH: /var/item-files
      ITEM_FILES_SIGNING_KEY: ${ITEM_FILES_SIGNING_KEY}
      KOFI_VERIFICATION_TOKEN: ${KOFI_VERIFICATION_TOKEN:-}
      WS_START_DELAY_SECONDS: ${WS_START_DELAY_SECONDS:-0}
      BACKFILL_STARTUP_DELAY_SECONDS: ${BACKFILL_STARTUP_DELAY_SECONDS:-20}
      IMPERSONATION_ENABLED: 'true'
      JAVA_OPTS: -Xms256m -Xmx1024m
    volumes:
      - staging-cdn-data:/var/cdn
      - staging-item-files-data:/var/item-files:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
  cdn:
    build:
      context: .
      dockerfile: docker/Dockerfile.cdn
    volumes:
      - staging-cdn-data:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
  criteria-checker:
    image: ghcr.io/tikugato/accsaber-criteria-script:latest
    pull_policy: always
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8000/health\", timeout=3).status==200 else 1)' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
  complexity-model:
    image: ghcr.io/tikugato/accsaber-complexity-model:develop
    pull_policy: always
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://127.0.0.1:8000/health\", timeout=3).status==200 else 1)' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 20s
volumes:
  staging-postgres-data:
  staging-cdn-data:
  staging-item-files-data:
