name: Tests

on:
  workflow_call:
    inputs:
      suite:
        description: 'unit, integration or external'
        type: string
        required: true

permissions:
  contents: read

jobs:
  run:
    name: ${{ inputs.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Make the wrapper executable
        run: chmod +x ./mvnw

      - name: Unit suite
        if: inputs.suite == 'unit'
        run: ./mvnw -B --no-transfer-progress verify

      - name: Tagged suite
        if: inputs.suite != 'unit'
        run: ./mvnw -B --no-transfer-progress test -Dgroups=${{ inputs.suite }} -DexcludedGroups=

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-${{ inputs.suite }}
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7
