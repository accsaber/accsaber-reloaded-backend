name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.vscode/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  unit:
    uses: ./.github/workflows/tests.yml
    with:
      suite: unit

  schema:
    uses: ./.github/workflows/tests.yml
    with:
      suite: integration

  release:
    needs: [unit, schema]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          bump=patch
          [ "${{ github.event_name }}" != "push" ] && bump=none
          case "$COMMIT_MSG" in
            *"[SKIP]"*)  bump=none ;;
            *"[MAJOR]"*) bump=major ;;
            *"[MINOR]"*) bump=minor ;;
          esac
          latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          [ -z "$latest" ] && latest="v0.0.0"
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$bump" in
            major) next="v$((major + 1)).0.0" ;;
            minor) next="v${major}.$((minor + 1)).0" ;;
            patch) next="v${major}.${minor}.$((patch + 1))" ;;
            none)  next="$latest" ;;
          esac
          if [ "$bump" = "none" ]; then
            tags="ghcr.io/${{ github.repository }}:latest"$'\n'"ghcr.io/${{ github.repository }}:sha-${{ github.sha }}"
          else
            tags="ghcr.io/${{ github.repository }}:latest"$'\n'"ghcr.io/${{ github.repository }}:${next}"
          fi
          echo "BUMP=${bump}" >> "$GITHUB_OUTPUT"
          echo "TAG=${next}" >> "$GITHUB_OUTPUT"
          echo "VERSION=${next#v}" >> "$GITHUB_OUTPUT"
          {
            echo "TAGS<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Bump: ${bump}, ${latest} -> ${next}"

      - uses: actions/setup-java@v6
        if: steps.version.outputs.BUMP != 'none'
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - name: Stamp version into pom
        if: steps.version.outputs.BUMP != 'none'
        run: |
          chmod +x ./mvnw
          ./mvnw -B --no-transfer-progress versions:set \
            -DnewVersion=${{ steps.version.outputs.VERSION }} \
            -DgenerateBackupPoms=false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.version.outputs.TAGS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create release
        if: steps.version.outputs.BUMP != 'none'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: ${{ steps.version.outputs.TAG }}
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Coolify
        if: steps.version.outputs.BUMP != 'none'
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_UUID: ${{ secrets.COOLIFY_PROD_UUID }}
        run: |
          curl --fail-with-body -sS -X GET \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_UUID}&force=false"
