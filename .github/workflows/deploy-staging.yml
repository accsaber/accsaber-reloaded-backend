name: Deploy staging

on:
  push:
    branches: [develop]
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - '.vscode/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  unit:
    uses: ./.github/workflows/tests.yml
    with:
      suite: unit

  schema:
    uses: ./.github/workflows/tests.yml
    with:
      suite: integration

  deploy:
    needs: [unit, schema]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:staging
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_UUID: ${{ secrets.COOLIFY_STAGING_UUID }}
        run: |
          if [ -z "${COOLIFY_UUID}" ]; then
            echo "COOLIFY_STAGING_UUID is not set, so the staging stack does not exist yet."
            echo "The image was still pushed and is ready to pull once it does."
            exit 0
          fi
          curl --fail-with-body -sS -X GET \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_UUID}&force=false"
